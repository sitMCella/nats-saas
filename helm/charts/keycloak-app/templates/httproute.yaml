apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak-route
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - name: {{ .Values.hug.gatewayName }}
      namespace: {{ .Values.hug.gatewayNamespace }}
  hostnames:
    - {{ .Values.keycloak.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /auth
      backendRefs:
        - name: keycloak-service
          port: 8080
